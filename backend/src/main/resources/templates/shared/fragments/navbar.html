<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- Navigation fragment -->
<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="/">APH Perfume</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'home'} ? 'active'" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'shop'} ? 'active'" href="/shop">Sản phẩm</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'about'} ? 'active'" href="/about">Giới thiệu</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'contact'} ? 'active'" href="/contact">Liên hệ</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <!-- Nếu đã đăng nhập -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <span class="text-dark">
                         <a href="/profile" class="text-dark text-decoration-none d-flex align-items-center">
                            <i class="fas fa-user-circle me-1"></i>
                            <strong sec:authentication="name">Tên người dùng</strong>
                         </a>
                     </span>
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="confirmLogout()">
                        <i class="fas fa-sign-out-alt me-1"></i> Đăng xuất
                    </button>

                    <!-- Form logout POST -->
                    <form id="logout-form" th:action="@{/logout}" method="post" style="display:none;">
                        <input type="hidden" name="_csrf" th:if="${_csrf != null}" th:value="${_csrf.token}"/>
                    </form>

                    <!-- Nút yêu thích chỉ hiển thị khi đã đăng nhập -->
                    <a href="/wishlist" class="btn btn-outline-danger">
                        <i class="fas fa-heart me-1"></i> Yêu thích
                    </a>
                </div>

                <!-- Nếu chưa đăng nhập -->
                <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-2">
                    <a href="/auth/login" class="btn btn-outline-dark">
                        <i class="fas fa-user me-1"></i> Đăng nhập
                    </a>
                </div>

                <!-- Giỏ hàng luôn hiển thị -->
                <a href="/cart" class="btn btn-dark">
                    <i class="fas fa-shopping-cart me-1"></i> Giỏ hàng
                </a>
            </div>
        </div>
    </div>
</nav>

<script th:fragment="logout-script">
    function confirmLogout() {
        Swal.fire({
            title: 'Xác nhận đăng xuất',
            text: 'Bạn có chắc chắn muốn đăng xuất không?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Đăng xuất',
            cancelButtonText: 'Hủy',
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                document.getElementById('logout-form').submit();
            }
        });
    }
</script>
</body>
</html>
