<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="scripts(additionalScripts)">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
        <script src="/js/chatbot.js"></script>
        <script src="/js/quickview.js"></script>
        <script>
            $(document).ready(function(){
                $('.flash-deal-carousel').owlCarousel({
                    loop: false,
                    margin: 20,
                    nav: true,
                    dots: true,
                    autoplay: true,
                    autoplayTimeout: 5000,
                    autoplayHoverPause: true,
                    navText: ["<i class='fas fa-chevron-left'></i>", "<i class='fas fa-chevron-right'></i>"],
                    responsive: {
                        0: {
                            items: 1
                        },
                        576: {
                            items: 2
                        },
                        768: {
                            items: 3
                        },
                        992: {
                            items: 4
                        },
                        1200: {
                            items: 5
                        }
                    }
                });
                
                $('.new-products-carousel').owlCarousel({
                    loop: true,
                    margin: 20,
                    nav: true,
                    dots: true,
                    autoplay: false,
                    autoplayTimeout: 6000,
                    autoplayHoverPause: true,
                    navText: ["<i class='fas fa-chevron-left'></i>", "<i class='fas fa-chevron-right'></i>"],
                    responsive: {
                        0: {
                            items: 1
                        },
                        576: {
                            items: 2
                        },
                        992: {
                            items: 3
                        }
                    }
                });
                
                $('.brands-carousel').owlCarousel({
                    loop: true,
                    margin: 30,
                    nav: false,
                    dots: false,
                    autoplay: true,
                    autoplayTimeout: 3000,
                    autoplayHoverPause: true,
                    responsive: {
                        0: {
                            items: 3
                        },
                        576: {
                            items: 4
                        },
                        768: {
                            items: 5
                        },
                        992: {
                            items: 6
                        }
                    }
                });
                
                function updateCountdown() {
                    const now = new Date();
                    const endDate = new Date();
                    endDate.setDate(endDate.getDate() + 2);
                    endDate.setHours(23, 59, 59, 999);
                    
                    const diff = endDate - now;
                    
                    if (diff <= 0) {
                        $('.countdown-value').eq(0).text('00');
                        $('.countdown-value').eq(1).text('00');
                        $('.countdown-value').eq(2).text('00');
                        $('.countdown-value').eq(3).text('00');
                        return;
                    }
                    
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    
                    $('.countdown-value').eq(0).text(days.toString().padStart(2, '0'));
                    $('.countdown-value').eq(1).text(hours.toString().padStart(2, '0'));
                    $('.countdown-value').eq(2).text(minutes.toString().padStart(2, '0'));
                    $('.countdown-value').eq(3).text(seconds.toString().padStart(2, '0'));
                }
                
                updateCountdown();
                setInterval(updateCountdown, 1000);
                
                $(window).scroll(function() {
                    $('.feature-item, .product-card, .collection-season, .blog-card').each(function() {
                        const elementTop = $(this).offset().top;
                        const viewportTop = $(window).scrollTop();
                        const windowHeight = $(window).height();
                        
                        if (elementTop < viewportTop + windowHeight - 100) {
                            $(this).addClass('animate__animated animate__fadeInUp');
                        }
                    });
                });
            });
        </script>
        <th:block th:replace="${additionalScripts}"></th:block>
    </th:block>
</body>
</html>
