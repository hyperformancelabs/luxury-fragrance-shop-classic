<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Marketing section sidebar submenu -->
    <div th:fragment="marketing-sidebar(activeSubmenu)" class="list-group mt-3">
        <a href="/admin/marketing" 
           th:class="${activeSubmenu == 'campaigns' ? 'list-group-item list-group-item-action active' : 'list-group-item list-group-item-action'}">
            <i class="fas fa-bullhorn me-2"></i> Chiến dịch
        </a>
        <a href="/admin/marketing/promotions" 
           th:class="${activeSubmenu == 'promotions' ? 'list-group-item list-group-item-action active' : 'list-group-item list-group-item-action'}">
            <i class="fas fa-tag me-2"></i> Khuyến mãi
        </a>
        <a href="/admin/marketing/banners" 
           th:class="${activeSubmenu == 'banners' ? 'list-group-item list-group-item-action active' : 'list-group-item list-group-item-action'}">
            <i class="fas fa-image me-2"></i> Banner
        </a>
    </div>
</body>
</html>
