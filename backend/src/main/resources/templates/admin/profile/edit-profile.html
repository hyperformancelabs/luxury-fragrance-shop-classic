<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa hồ sơ - Admin LFS</title>
    
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin-style.css">
    <link rel="stylesheet" href="/css/admin-profile.css">
</head>
<body>
    <!-- Include sidebar và navbar -->
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>
    
    <div class="main-content">
        <!-- Include navbar -->
        <div th:replace="~{admin/layout/navbar :: navbar}"></div>
        
        <!-- Edit Profile Content -->
        <div class="content-wrapper">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-header-content">
                    <h1 class="page-title">
                        <i class="fas fa-user-edit me-2"></i>
                        Chỉnh sửa hồ sơ
                    </h1>
                    <p class="page-subtitle">Cập nhật thông tin tài khoản admin của bạn</p>
                </div>
                <div class="page-actions">
                    <a href="/admin/profile" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Quay lại
                    </a>
                </div>
            </div>

            <!-- Alert Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Edit Profile Form -->
            <form action="/admin/profile/update" method="post" enctype="multipart/form-data" class="edit-profile-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                
                <div class="row">
                    <!-- Avatar & Basic Info -->
                    <div class="col-lg-4">
                        <div class="profile-card">
                            <div class="profile-card-header">
                                <h4 class="card-title">
                                    <i class="fas fa-image me-2"></i>
                                    Ảnh đại diện
                                </h4>
                            </div>
                            
                            <div class="avatar-upload-container">
                                <div class="avatar-preview">
                                    <img id="avatarPreview" 
                                         th:src="${employee.profilePictureUrl != null ? employee.profilePictureUrl : '/images/default-avatar.png'}" 
                                         class="profile-avatar-large" alt="Avatar">
                                    <div class="avatar-upload-overlay">
                                        <i class="fas fa-camera fa-2x"></i>
                                        <p>Nhấn để thay đổi</p>
                                    </div>
                                </div>
                                
                                <input type="file" id="avatar" name="avatar" class="d-none" 
                                       accept="image/*" onchange="previewAvatar(this)">
                                
                                <button type="button" class="btn btn-outline-primary mt-3" 
                                        onclick="document.getElementById('avatar').click()">
                                    <i class="fas fa-upload me-2"></i>Chọn ảnh mới
                                </button>
                                
                                <small class="text-muted d-block mt-2">
                                    Định dạng: JPG, PNG. Kích thước tối đa: 5MB
                                </small>
                            </div>
                        </div>
                    </div>

                    <!-- Form Fields -->
                    <div class="col-lg-8">
                        <div class="profile-card">
                            <div class="profile-card-header">
                                <h4 class="card-title">
                                    <i class="fas fa-user me-2"></i>
                                    Thông tin cá nhân
                                </h4>
                            </div>
                            
                            <div class="form-grid">
                                <!-- Username (readonly) -->
                                <div class="form-group">
                                    <label for="username" class="form-label">Tên đăng nhập</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                                        <input type="text" id="username" class="form-control" 
                                               th:value="${employee.username}" readonly>
                                    </div>
                                    <small class="text-muted">Tên đăng nhập không thể thay đổi</small>
                                </div>

                                <!-- Full Name -->
                                <div class="form-group">
                                    <label for="fullName" class="form-label">
                                        Họ và tên <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-signature"></i></span>
                                        <input type="text" id="fullName" name="fullName" class="form-control" 
                                               th:value="${employee.fullName}" maxlength="100" required>
                                    </div>
                                </div>

                                <!-- Email -->
                                <div class="form-group">
                                    <label for="email" class="form-label">
                                        Email <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                        <input type="email" id="email" name="email" class="form-control" 
                                               th:value="${employee.email}" maxlength="100" required>
                                    </div>
                                </div>

                                <!-- Phone Number -->
                                <div class="form-group">
                                    <label for="phoneNumber" class="form-label">
                                        Số điện thoại <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                        <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" 
                                               th:value="${employee.phoneNumber}" maxlength="20" required>
                                    </div>
                                </div>

                                <!-- Date of Birth -->
                                <div class="form-group">
                                    <label for="dateOfBirth" class="form-label">Ngày sinh</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-birthday-cake"></i></span>
                                        <input type="date" id="dateOfBirth" name="dateOfBirth" class="form-control" 
                                               th:value="${employee.dateOfBirth != null ? #dates.format(employee.dateOfBirth, 'yyyy-MM-dd') : ''}">
                                    </div>
                                </div>

                                <!-- Address -->
                                <div class="form-group full-width">
                                    <label for="address" class="form-label">Địa chỉ</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                                        <textarea id="address" name="address" class="form-control" rows="3" 
                                                  maxlength="200" th:text="${employee.address}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Password Change Section -->
                        <div class="profile-card mt-4">
                            <div class="profile-card-header">
                                <h4 class="card-title">
                                    <i class="fas fa-lock me-2"></i>
                                    Thay đổi mật khẩu
                                </h4>
                                <small class="text-muted">Để trống nếu không muốn thay đổi mật khẩu</small>
                            </div>
                            
                            <div class="form-grid">
                                <!-- Current Password -->
                                <div class="form-group">
                                    <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-key"></i></span>
                                        <input type="password" id="currentPassword" name="currentPassword" 
                                               class="form-control">
                                    </div>
                                </div>

                                <!-- New Password -->
                                <div class="form-group">
                                    <label for="newPassword" class="form-label">Mật khẩu mới</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                        <input type="password" id="newPassword" name="newPassword" 
                                               class="form-control" minlength="6">
                                    </div>
                                    <small class="text-muted">Tối thiểu 6 ký tự</small>
                                </div>

                                <!-- Confirm Password -->
                                <div class="form-group">
                                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-check"></i></span>
                                        <input type="password" id="confirmPassword" name="confirmPassword" 
                                               class="form-control">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="form-actions mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i>Lưu thay đổi
                            </button>
                            <a href="/admin/profile" class="btn btn-secondary btn-lg ms-3">
                                <i class="fas fa-times me-2"></i>Hủy bỏ
                            </a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Avatar preview function
        function previewAvatar(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                // Validate file type
                if (!file.type.startsWith('image/')) {
                    alert('Vui lòng chọn file ảnh');
                    input.value = '';
                    return;
                }
                
                // Validate file size (5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert('Kích thước file không được vượt quá 5MB');
                    input.value = '';
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Password validation
        function validatePasswords() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword && !currentPassword) {
                alert('Vui lòng nhập mật khẩu hiện tại để thay đổi mật khẩu');
                return false;
            }
            
            if (newPassword !== confirmPassword) {
                alert('Mật khẩu mới và xác nhận mật khẩu không khớp');
                return false;
            }
            
            return true;
        }

        // Form submission validation
        document.querySelector('.edit-profile-form').addEventListener('submit', function(e) {
            if (!validatePasswords()) {
                e.preventDefault();
            }
        });

        // Real-time password confirmation validation
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = this.value;
            
            if (newPassword !== confirmPassword) {
                this.setCustomValidity('Mật khẩu xác nhận không khớp');
                this.classList.add('is-invalid');
            } else {
                this.setCustomValidity('');
                this.classList.remove('is-invalid');
            }
        });

        // Auto dismiss alerts after 5 seconds
        setTimeout(function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            });
        }, 5000);
    </script>
</body>
</html>
