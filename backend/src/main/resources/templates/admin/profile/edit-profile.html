<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{admin/layout/layout :: html(
        title='Chỉnh sửa hồ sơ - Admin LFS',
        activeMenu='profile',
        content=~{::content},
        additionalCss=~{::additionalCss},
        additionalJs=~{::additionalJs}
      )}">
<head>
    <additionalCss>
        <style>
            /* Profile styling */
            .profile-card {
                background-color: #fff;
                border-radius: 0.5rem;
                box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
                margin-bottom: 1.5rem;
                overflow: hidden;
            }
            
            .profile-card-header {
                padding: 1.5rem;
                border-bottom: 1px solid #f0f0f0;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            
            .card-title {
                font-size: 1.25rem;
                font-weight: 600;
                margin-bottom: 0;
                display: flex;
                align-items: center;
            }
            
            .avatar-upload-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 1.5rem;
            }
            
            .avatar-preview {
                position: relative;
                width: 150px;
                height: 150px;
                margin-bottom: 1rem;
            }
            
            .profile-avatar-large {
                width: 100%;
                height: 100%;
                border-radius: 50%;
                object-fit: cover;
                border: 3px solid #fff;
                box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.1);
            }
            
            .avatar-upload-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                border-radius: 50%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: white;
                opacity: 0;
                transition: opacity 0.3s;
                cursor: pointer;
            }
            
            .avatar-preview:hover .avatar-upload-overlay {
                opacity: 1;
            }
            
            .form-grid {
                padding: 1.5rem;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
            
            .form-group {
                margin-bottom: 0;
            }
            
            .form-group.full-width {
                grid-column: 1 / -1;
            }
            
            .form-label {
                font-weight: 500;
                margin-bottom: 0.5rem;
            }
            
            .input-group {
                margin-bottom: 0.5rem;
            }
            
            .form-actions {
                display: flex;
                gap: 1rem;
                justify-content: flex-end;
                margin-top: 1.5rem;
            }
            
            /* Page header */
            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 1.5rem;
                padding-bottom: 1rem;
                border-bottom: 1px solid #dee2e6;
            }
            
            .page-title {
                font-size: 1.5rem;
                font-weight: 600;
                margin-bottom: 0.25rem;
                display: flex;
                align-items: center;
            }
            
            .page-subtitle {
                color: #6c757d;
                margin-bottom: 0;
            }
            
            .page-actions {
                display: flex;
                gap: 0.5rem;
            }
            
            .text-danger {
                color: #dc3545;
            }
            
            .text-muted {
                color: #6c757d;
                font-size: 0.875rem;
            }
            
            .edit-profile-form {
                margin-bottom: 2rem;
            }
        </style>
    </additionalCss>
</head>
<body>
    <content>
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">
                    <i class="fas fa-user-edit me-2"></i>
                    Chỉnh sửa hồ sơ
                </h1>
                <p class="page-subtitle">Cập nhật thông tin tài khoản admin của bạn</p>
            </div>
            <div class="page-actions">
                <a href="/admin/profile" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Quay lại
                </a>
            </div>
        </div>

        <!-- Alert Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Edit Profile Form -->
        <form action="/admin/profile/update" method="post" enctype="multipart/form-data" class="edit-profile-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            
            <div class="row">
                <!-- Avatar & Basic Info -->
                <div class="col-lg-4">
                    <div class="profile-card">
                        <div class="profile-card-header">
                            <h4 class="card-title">
                                <i class="fas fa-image me-2"></i>
                                Ảnh đại diện
                            </h4>
                        </div>
                        
                        <div class="avatar-upload-container">
                            <div class="avatar-preview">
                                <img id="avatarPreview" 
                                     th:src="${employee.profilePictureUrl != null ? employee.profilePictureUrl : '/images/default-avatar.png'}" 
                                     class="profile-avatar-large" alt="Avatar">
                                <div class="avatar-upload-overlay">
                                    <i class="fas fa-camera fa-2x"></i>
                                    <p>Nhấn để thay đổi</p>
                                </div>
                            </div>
                            
                            <input type="file" id="avatar" name="avatar" class="d-none" 
                                   accept="image/*" onchange="previewAvatar(this)">
                            
                            <button type="button" class="btn btn-outline-primary mt-3" 
                                    onclick="document.getElementById('avatar').click()">
                                <i class="fas fa-upload me-2"></i>Chọn ảnh mới
                            </button>
                            
                            <small class="text-muted d-block mt-2">
                                Định dạng: JPG, PNG. Kích thước tối đa: 5MB
                            </small>
                        </div>
                    </div>
                </div>

                <!-- Form Fields -->
                <div class="col-lg-8">
                    <div class="profile-card">
                        <div class="profile-card-header">
                            <h4 class="card-title">
                                <i class="fas fa-user me-2"></i>
                                Thông tin cá nhân
                            </h4>
                        </div>
                        
                        <div class="form-grid">
                            <!-- Username (readonly) -->
                            <div class="form-group">
                                <label for="username" class="form-label">Tên đăng nhập</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" id="username" class="form-control" 
                                           th:value="${employee.username}" readonly>
                                </div>
                                <small class="text-muted">Tên đăng nhập không thể thay đổi</small>
                            </div>

                            <!-- Full Name -->
                            <div class="form-group">
                                <label for="fullName" class="form-label">
                                    Họ và tên <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-signature"></i></span>
                                    <input type="text" id="fullName" name="fullName" class="form-control" 
                                           th:value="${employee.fullName}" maxlength="100" required>
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="form-group">
                                <label for="email" class="form-label">
                                    Email <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" id="email" name="email" class="form-control" 
                                           th:value="${employee.email}" maxlength="100" required>
                                </div>
                            </div>

                            <!-- Phone Number -->
                            <div class="form-group">
                                <label for="phoneNumber" class="form-label">
                                    Số điện thoại <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                    <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" 
                                           th:value="${employee.phoneNumber}" maxlength="20" required>
                                </div>
                            </div>

                            <!-- Date of Birth -->
                            <div class="form-group">
                                <label for="dateOfBirth" class="form-label">Ngày sinh</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-birthday-cake"></i></span>
                                    <input type="date" id="dateOfBirth" name="dateOfBirth" class="form-control" 
                                           th:value="${employee.dateOfBirth != null ? #dates.format(employee.dateOfBirth, 'yyyy-MM-dd') : ''}">
                                </div>
                            </div>

                            <!-- Address -->
                            <div class="form-group full-width">
                                <label for="address" class="form-label">Địa chỉ</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                                    <textarea id="address" name="address" class="form-control" rows="3" 
                                              maxlength="200" th:text="${employee.address}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Password Change Section -->
                    <div class="profile-card mt-4">
                        <div class="profile-card-header">
                            <h4 class="card-title">
                                <i class="fas fa-lock me-2"></i>
                                Thay đổi mật khẩu
                            </h4>
                            <small class="text-muted">Để trống nếu không muốn thay đổi mật khẩu</small>
                        </div>
                        
                        <div class="form-grid">
                            <!-- Current Password -->
                            <div class="form-group">
                                <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                                    <input type="password" id="currentPassword" name="currentPassword" 
                                           class="form-control">
                                </div>
                            </div>

                            <!-- New Password -->
                            <div class="form-group">
                                <label for="newPassword" class="form-label">Mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" id="newPassword" name="newPassword" 
                                           class="form-control" minlength="6">
                                </div>
                                <small class="text-muted">Tối thiểu 6 ký tự</small>
                            </div>

                            <!-- Confirm Password -->
                            <div class="form-group">
                                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-check"></i></span>
                                    <input type="password" id="confirmPassword" name="confirmPassword" 
                                           class="form-control">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="form-actions mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save me-2"></i>Lưu thay đổi
                        </button>
                        <a href="/admin/profile" class="btn btn-secondary btn-lg ms-3">
                            <i class="fas fa-times me-2"></i>Hủy bỏ
                        </a>
                    </div>
                </div>
            </div>
        </form>
    </content>
    
    <additionalJs>
        <script>
            // Avatar preview function
            function previewAvatar(input) {
                if (input.files && input.files[0]) {
                    const file = input.files[0];
                    
                    // Validate file type
                    if (!file.type.startsWith('image/')) {
                        alert('Vui lòng chọn file ảnh');
                        input.value = '';
                        return;
                    }
                    
                    // Validate file size (5MB)
                    if (file.size > 5 * 1024 * 1024) {
                        alert('Kích thước file không được vượt quá 5MB');
                        input.value = '';
                        return;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.getElementById('avatarPreview').src = e.target.result;
                    }
                    reader.readAsDataURL(file);
                }
            }
            
            // Password confirmation validation
            document.getElementById('confirmPassword').addEventListener('input', function() {
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = this.value;
                
                if (newPassword !== confirmPassword) {
                    this.setCustomValidity('Mật khẩu xác nhận không khớp');
                } else {
                    this.setCustomValidity('');
                }
            });
            
            // Auto dismiss alerts after 5 seconds
            setTimeout(function() {
                const alerts = document.querySelectorAll('.alert');
                alerts.forEach(function(alert) {
                    const bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                });
            }, 5000);
        </script>
    </additionalJs>
</body>
</html>
