<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light">
    <div class="container-fluid">
        <!-- Mobile menu toggle -->
        <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <!-- Page title -->
        <span class="navbar-brand mb-0 h1" th:text="${pageTitle ?: 'Admin Dashboard'}">Admin Dashboard</span>
        
        <!-- Right side dropdown -->
        <div class="navbar-nav ms-auto">
            <div class="nav-item dropdown">
                <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdown" 
                   role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="/images/default-avatar.png" class="rounded-circle me-2" width="32" height="32" alt="Avatar">
                    <span sec:authentication="name">Admin</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="/admin/profile">
                        <i class="fas fa-user me-2"></i>Hồ sơ cá nhân
                    </a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/admin/logout}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="dropdown-item">
                                <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

</html>
