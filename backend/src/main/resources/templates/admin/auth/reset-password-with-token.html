<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu Admin - APH Perfume</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .login-box h3 {
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        .login-box .form-control:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 0.2rem rgba(108, 99, 255, 0.25);
        }

        .text-muted a {
            text-decoration: none;
        }

        .text-muted a:hover {
            text-decoration: underline;
        }

        .info-text {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .input-group-text {
            background-color: transparent;
            border-left: none;
            cursor: pointer;
        }

        .input-group .form-control {
            border-right: none;
        }

        .input-group .form-control:focus {
            box-shadow: none;
        }

        .password-requirements {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.5rem;
        }

        .token-info {
            background-color: #e9ecef;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="login-box">
    <div class="text-center mb-4">
        <i class="fas fa-shield-alt fa-3x text-success mb-3"></i>
        <h3>Đặt lại mật khẩu Admin</h3>
    </div>

    <div th:if="${employeeName}" class="token-info text-center">
        <i class="fas fa-user-check text-success me-2"></i>
        <strong th:text="'Xác thực thành công cho: ' + ${employeeName}"></strong>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/reset-password-with-token}" method="post" th:if="${token}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="token" th:value="${token}" />

        <div class="mb-3">
            <label for="newPassword" class="form-label">
                <i class="fas fa-lock me-2"></i>Mật khẩu mới
            </label>
            <div class="input-group">
                <input type="password" class="form-control" id="newPassword" name="newPassword" 
                       placeholder="Nhập mật khẩu mới" required minlength="6">
                <span class="input-group-text" onclick="togglePassword('newPassword', 'toggleIconNew')">
                    <i class="fas fa-eye" id="toggleIconNew"></i>
                </span>
            </div>
            <div class="password-requirements">
                <i class="fas fa-info-circle me-1"></i>
                Mật khẩu phải có ít nhất 6 ký tự
            </div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">
                <i class="fas fa-lock me-2"></i>Xác nhận mật khẩu
            </label>
            <div class="input-group">
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                       placeholder="Nhập lại mật khẩu mới" required minlength="6">
                <span class="input-group-text" onclick="togglePassword('confirmPassword', 'toggleIconConfirm')">
                    <i class="fas fa-eye" id="toggleIconConfirm"></i>
                </span>
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100 mb-3" id="submitBtn">
            <i class="fas fa-check me-2"></i>Đặt lại mật khẩu
        </button>
    </form>

    <div th:unless="${token}" class="text-center">
        <div class="alert alert-warning">
            <i class="fas fa-exclamation-triangle me-2"></i>
            Token không hợp lệ hoặc đã hết hạn.
        </div>
        <a href="/admin/forgot-password" class="btn btn-primary">
            <i class="fas fa-arrow-left me-2"></i>Yêu cầu mã mới
        </a>
    </div>

    <div class="text-center mt-3">
        <a href="/admin/login" class="text-decoration-none">
            <i class="fas fa-arrow-left me-2"></i>Quay lại đăng nhập
        </a>
    </div>
</div>

<script>
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

    // Password confirmation validation
    document.addEventListener("DOMContentLoaded", function () {
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');

        function validatePasswords() {
            if (newPassword && confirmPassword && submitBtn) {
                if (newPassword.value !== confirmPassword.value) {
                    confirmPassword.setCustomValidity('Mật khẩu không khớp');
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-times me-2"></i>Mật khẩu không khớp';
                    submitBtn.classList.remove('btn-success');
                    submitBtn.classList.add('btn-danger');
                } else {
                    confirmPassword.setCustomValidity('');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-check me-2"></i>Đặt lại mật khẩu';
                    submitBtn.classList.remove('btn-danger');
                    submitBtn.classList.add('btn-success');
                }
            }
        }

        if (newPassword && confirmPassword) {
            newPassword.addEventListener('input', validatePasswords);
            confirmPassword.addEventListener('input', validatePasswords);
        }

        // Show error messages using SweetAlert2
        const errorAlert = document.querySelector('.alert-danger');
        if (errorAlert) {
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'error',
                title: errorAlert.textContent,
                showConfirmButton: false,
                timer: 4000,
                timerProgressBar: true
            });
            errorAlert.style.display = 'none';
        }
    });
</script>

</body>
</html>
