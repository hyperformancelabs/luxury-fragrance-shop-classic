<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu Admin - APH Perfume</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .login-box h3 {
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        .login-box .form-control:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 0.2rem rgba(108, 99, 255, 0.25);
        }

        .text-muted a {
            text-decoration: none;
        }

        .text-muted a:hover {
            text-decoration: underline;
        }

        .info-text {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="login-box">
    <div class="text-center mb-4">
        <i class="fas fa-key fa-3x text-primary mb-3"></i>
        <h3>Quên mật khẩu Admin</h3>
        <p class="info-text">
            Nhập địa chỉ email của bạn để nhận mã xác thực đặt lại mật khẩu.
        </p>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="mb-3">
            <label for="email" class="form-label">
                <i class="fas fa-envelope me-2"></i>Email
            </label>
            <input type="email" class="form-control" id="email" name="email" 
                   placeholder="Nhập địa chỉ email admin" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">
            <i class="fas fa-paper-plane me-2"></i>Gửi mã xác thực
        </button>
    </form>

    <div class="text-center">
        <a href="/admin/login" class="text-decoration-none">
            <i class="fas fa-arrow-left me-2"></i>Quay lại đăng nhập
        </a>
    </div>
</div>

<script>
    // Show success/error messages using SweetAlert2
    document.addEventListener("DOMContentLoaded", function () {
        const successAlert = document.querySelector('.alert-success');
        const errorAlert = document.querySelector('.alert-danger');
        
        if (successAlert) {
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: successAlert.textContent,
                showConfirmButton: false,
                timer: 5000,
                timerProgressBar: true
            });
            successAlert.style.display = 'none';
        }
        
        if (errorAlert) {
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'error',
                title: errorAlert.textContent,
                showConfirmButton: false,
                timer: 4000,
                timerProgressBar: true
            });
            errorAlert.style.display = 'none';
        }
    });
</script>

</body>
</html>
