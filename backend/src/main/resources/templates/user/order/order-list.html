<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng đã đặt - APH Perfume</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
<!-- Navigation -->
<nav th:replace="~{shared/fragments/navbar :: navbar('order')}"></nav>

<!-- Breadcrumb -->
<header class="breadcrumb-section">
  <div class="container">
    <nav class="d-flex">
      <a href="/" class="me-2">TRANG CHỦ</a>
      <span class="mx-2">/</span>
      <a href="/track-order" class="me-2">TRA CỨU ĐƠN HÀNG</a>
      <span class="mx-2">/</span>
      <span>KẾT QUẢ</span>
    </nav>
  </div>
</header>

<main class="container py-5">
  <div class="profile-card">
    <div class="profile-card-header">
      <h2 class="profile-card-title">Kết quả tra cứu đơn hàng</h2>
    </div>

    <div th:if="${!orders.isEmpty()}">
      <table class="orders-table">
        <thead>
        <tr>
          <th>Mã đơn hàng</th>
          <th>Ngày đặt</th>
          <th>Tổng tiền</th>
          <th>Trạng thái</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
          <td th:text="${order.orderId}">APH123456789</td>
          <td th:text="${order.orderDate}">15/05/2023 14:30</td>
          <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT') + 'đ'}">8.000.000đ</td>
          <td>
                                <span class="order-status"
                                      th:classappend="${
                                        order.orderStatus == 'Đã giao hàng' ? 'order-status-delivered' :
                                        (order.orderStatus == 'Đang giao hàng' ? 'order-status-shipping' :
                                        (order.orderStatus == 'Đang xử lý' ? 'order-status-processing' : 'order-status-cancelled'))
                                      }"
                                      th:text="${order.orderStatus}">Đã giao hàng</span>
          </td>
          <td>
            <a th:href="@{'/order-success?orderId=' + ${order.orderId}}" class="view-order-btn">
              <i class="fas fa-eye me-1"></i> Xem
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div th:if="${orders.isEmpty()}" class="text-center py-5">
      <i class="fas fa-shopping-bag fa-3x text-muted mb-3"></i>
      <h3>Không tìm thấy đơn hàng nào</h3>
      <p class="text-muted mb-4">Vui lòng kiểm tra lại số điện thoại hoặc liên hệ với chúng tôi để được hỗ trợ.</p>
      <a href="/track-order" class="btn btn-dark">Thử lại</a>
    </div>
  </div>
</main>

<!-- Footer -->
    <footer th:replace="~{shared/fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
