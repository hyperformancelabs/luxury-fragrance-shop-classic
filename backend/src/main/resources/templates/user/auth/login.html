<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/fragments/head :: head('Đăng nhập', ~{::link})}">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<!-- Navigation -->
<nav th:replace="~{shared/fragments/navbar :: navbar('login')}"></nav>

<!-- Breadcrumb -->
<header class="breadcrumb-section">
    <div class="container">
        <nav class="d-flex">
            <a href="/" class="me-2">TRANG CHỦ</a>
            <span class="mx-2">/</span>
            <span>ĐĂNG NHẬP</span>
        </nav>
    </div>
</header>

<main class="container py-5">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Đăng nhập</h1>
                <p class="auth-subtitle">Chào mừng bạn quay trở lại!</p>
            </div>

            <div class="social-login">
                <button type="button" class="social-btn" onclick="showFeatureToast()">
                    <i class="fab fa-google social-btn-icon"></i> Google
                </button>
                <button type="button" class="social-btn" onclick="showFeatureToast()">
                    <i class="fab fa-facebook-f social-btn-icon"></i> Facebook
                </button>
            </div>

            <div class="divider">
                <span class="divider-text">HOẶC</span>
            </div>

            <!-- FORM gửi về /auth/precheck -->
            <form th:action="@{/auth/precheck}" method="post">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

                <div th:if="${param.error}" class="alert alert-danger">Tên đăng nhập hoặc mật khẩu không đúng.</div>
                <div th:if="${param.logout}" class="alert alert-success">Bạn đã đăng xuất thành công.</div>
                <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

                <div class="form-group">
                    <label for="usernameEmailOrPhone" class="form-label">Tên đăng nhập, số điện thoại hoặc email</label>
                    <input type="text" id="usernameEmailOrPhone" name="usernameEmailOrPhone" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" class="form-control" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="remember-me" name="remember-me" class="form-check-input">
                    <label for="remember-me" class="form-check-label">Ghi nhớ đăng nhập</label>
                </div>

                <button type="submit" class="auth-btn">Đăng nhập</button>
            </form>

            <div class="auth-footer">
                <p>Chưa có tài khoản? <a href="/auth/register" class="auth-link">Đăng ký ngay</a></p>
                <p><a href="/auth/forgot-password" class="auth-link">Quên mật khẩu?</a></p>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
    <footer th:replace="~{shared/fragments/footer :: footer}"></footer>

<!-- Toast Notification (Top Right) -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 9999">
    <div id="featureToast" class="toast align-items-center bg-light text-dark border border-secondary shadow-sm" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="fas fa-circle-info text-primary me-2"></i>
                Tính năng này hiện đang được phát triển. Vui lòng quay lại sau!
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const icon = document.querySelector('.password-toggle i');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    function showFeatureToast() {
        const toastEl = document.getElementById('featureToast');
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        let successMessage = /*[[${success}]]*/ null;
        let errorMessage = /*[[${error}]]*/ null;
        let infoMessage = /*[[${info}]]*/ null;

        if (successMessage) {
            Swal.fire({
                icon: 'success',
                title: successMessage,
                showConfirmButton: false,
                timer: 2500
            });
        }

        if (errorMessage) {
            Swal.fire({
                icon: 'error',
                title: 'Lỗi',
                text: errorMessage,
                confirmButtonText: 'Đóng'
            });
        }

        if (infoMessage) {
            Swal.fire({
                icon: 'info',
                title: 'Thông báo',
                text: infoMessage,
                confirmButtonText: 'Đóng'
            });
        }
    });
</script>
</body>
</html>
