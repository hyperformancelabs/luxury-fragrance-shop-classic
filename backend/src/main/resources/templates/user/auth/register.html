<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/fragments/head :: head('Đăng ký', ~{::link})}">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- Navigation -->
    <nav th:replace="~{shared/fragments/navbar :: navbar('register')}"></nav>

    <!-- Breadcrumb -->
    <header class="breadcrumb-section">
        <div class="container">
            <nav class="d-flex">
                <a href="/" class="me-2">TRANG CHỦ</a>
                <span class="mx-2">/</span>
                <span>ĐĂNG KÝ</span>
            </nav>
        </div>
    </header>

    <main class="container py-5">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-title">Đăng ký tài khoản</h1>
                    <p class="auth-subtitle">Tạo tài khoản để mua sắm dễ dàng hơn</p>
                </div>

                <div class="social-login">
                    <button type="button" class="social-btn" onclick="showFeatureToast()">
                        <i class="fab fa-google social-btn-icon"></i> Google
                    </button>
                    <button type="button" class="social-btn" onclick="showFeatureToast()">
                        <i class="fab fa-facebook-f social-btn-icon"></i> Facebook
                    </button>
                </div>

                <div class="divider">
                    <span class="divider-text">HOẶC</span>
                </div>
                
                <form action="/auth/signup" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
                        Đã có lỗi xảy ra.
                    </div>
                    
                    <div class="form-group">
                        <label for="name" class="form-label">Họ và tên</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="username" class="form-label">Tên đăng nhập</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone" class="form-label">Số điện thoại</label>
                        <input type="tel" id="phone" name="phoneNumber" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" name="password" class="form-control" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-check">
                        <input type="checkbox" id="terms" name="terms" class="form-check-input" required>
                        <label for="terms" class="form-check-label">Tôi đồng ý với <a href="#">điều khoản và điều kiện</a></label>
                    </div>
                    
                    <button type="submit" class="auth-btn">Đăng ký</button>
                </form>
                
                <div class="auth-footer">
                    <p>Đã có tài khoản? <a href="/auth/login" class="auth-link">Đăng nhập</a></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{shared/fragments/footer :: footer}"></footer>

    <!-- Toast Notification (Top Right) -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999">
        <div id="featureToast" class="toast align-items-center bg-light text-dark border border-secondary shadow-sm" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="fas fa-circle-info text-primary me-2"></i>
                    Tính năng này hiện đang được phát triển. Vui lòng quay lại sau!
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(inputId) {
            const passwordInput = document.getElementById(inputId);
            const icon = document.querySelector(`#${inputId} + .password-toggle i`);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showFeatureToast() {
            const toastEl = document.getElementById('featureToast');
            const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
            toast.show();
        }
    </script>
    <script>
        function togglePassword(inputId) {
            const passwordInput = document.getElementById(inputId);
            const icon = document.querySelector(`#${inputId} + .password-toggle i`);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
