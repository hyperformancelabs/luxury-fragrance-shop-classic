<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - APH Perfume</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="/">APH Perfume</a>
    </div>
</nav>

<main class="container py-5">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Quên mật khẩu</h1>
                <p class="auth-subtitle">Nhập địa chỉ email của bạn để nhận mã xác thực đặt lại mật khẩu.</p>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form action="/auth/forgot-password" method="post">
                <div class="form-group mb-3">
                    <label for="email" class="form-label">Địa chỉ email</label>
                    <input type="email" id="email" name="email" class="form-control" 
                           placeholder="Nhập email của bạn" required>
                </div>

                <button type="submit" class="auth-btn w-100">Gửi mã xác thực</button>
            </form>

            <div class="auth-footer">
                <p>Nhớ mật khẩu? <a href="/auth/login" class="auth-link">Đăng nhập ngay</a></p>
                <p>Chưa có tài khoản? <a href="/auth/register" class="auth-link">Đăng ký</a></p>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{shared/fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
