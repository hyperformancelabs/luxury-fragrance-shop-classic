<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - APH Perfume</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="/">APH Perfume</a>
    </div>
</nav>

<main class="container py-5">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Đặt lại mật khẩu</h1>
                <p class="auth-subtitle">Xin chào <span th:text="${customerName}">Khách hàng</span>, vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form action="/auth/reset-password-with-token" method="post">
                <input type="hidden" name="token" th:value="${token}"/>

                <div class="form-group mb-3">
                    <label for="newPassword" class="form-label">Mật khẩu mới</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" name="newPassword" class="form-control" 
                               placeholder="Nhập mật khẩu mới (ít nhất 6 ký tự)" required minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword('newPassword')">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" 
                               placeholder="Nhập lại mật khẩu mới" required minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-btn w-100">Cập nhật mật khẩu</button>
            </form>

            <div class="auth-footer">
                <p>Nhớ mật khẩu? <a href="/auth/login" class="auth-link">Đăng nhập ngay</a></p>
                <p>Mã xác thực không đúng? <a href="/auth/forgot-password" class="auth-link">Yêu cầu mã mới</a></p>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{shared/fragments/footer :: footer}"></footer>

<script>
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = field.nextElementSibling.querySelector('i');
        
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // Validate password match before submit
    document.querySelector('form').addEventListener('submit', function (e) {
        const newPw = document.getElementById('newPassword').value;
        const confirmPw = document.getElementById('confirmPassword').value;
        
        if (newPw !== confirmPw) {
            e.preventDefault();
            alert("Mật khẩu xác nhận không khớp.");
            return false;
        }
        
        if (newPw.length < 6) {
            e.preventDefault();
            alert("Mật khẩu phải có ít nhất 6 ký tự.");
            return false;
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
