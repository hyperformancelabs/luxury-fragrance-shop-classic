<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{shared/fragments/head :: head('Giỏ hàng', ~{::link})}">
    <link rel="stylesheet" href="/css/cart.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Navigation -->
    <nav th:replace="~{shared/fragments/navbar :: navbar('cart')}"></nav>

    <!-- Breadcrumb -->
    <header class="breadcrumb-section">
        <div class="container">
            <nav class="d-flex">
                <a href="/" class="me-2">TRANG CHỦ</a>
                <span class="mx-2">/</span>
                <span>GIỎ HÀNG</span>
            </nav>
        </div>
    </header>

    <main class="container py-5">
        <h1 class="mb-4">Giỏ hàng của bạn</h1>
        
        <div th:if="${itemCount > 0}" class="row">
            <!-- Cart Items -->
            <div class="col-lg-8 mb-4 mb-lg-0">
                <div class="cart-container">
                    <div class="cart-header">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>Sản phẩm</h5>
                            </div>
                            <div class="col-md-2 text-center">
                                <h5>Giá</h5>
                            </div>
                            <div class="col-md-2 text-center">
                                <h5>Số lượng</h5>
                            </div>
                            <div class="col-md-2 text-end">
                                <h5>Tổng</h5>
                            </div>
                        </div>
                    </div>
                    
                    <div th:each="item : ${cartItems}" class="cart-item" th:data-id="${item.cartItemId}">
                        <div class="row w-100 align-items-center">
                            <div class="col-md-6 d-flex align-items-center">
                                <img th:src="${item.imageUrl}" class="cart-item-image" alt="Product Image">
                                <div class="cart-item-details">
                                    <h5 class="cart-item-name" th:text="${item.productName}">Tên sản phẩm</h5>
                                    <div class="cart-item-brand" th:text="${item.brandName}">Thương hiệu</div>
                                    <div class="cart-item-size" th:text="${'Dung tích: ' + item.volume + 'ml'}">Dung tích: 50ml</div>
                                </div>
                            </div>
                            <div class="col-md-2 text-center">
                                <div th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT') + 'đ'}">2.400.000đ</div>
                            </div>
                            <div class="col-md-2 text-center">
                                <form class="update-form" th:action="@{/cart/update}" method="post">
                                    <input type="hidden" name="cartItemId" th:value="${item.cartItemId}">
                                    <input type="hidden" name="_csrf" th:value="${_csrf != null ? _csrf.token : ''}">
                                    <div class="quantity-selector">
                                        <button type="button" class="quantity-btn quantity-decrease">-</button>
                                        <input type="number" name="quantity" class="quantity-input" th:value="${item.quantity}" value="1" min="1">
                                        <button type="button" class="quantity-btn quantity-increase">+</button>
                                    </div>
                                </form>
                            </div>
                            <div class="col-md-2 text-end">
                                <div class="cart-item-price" th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT') + 'đ'}">4.800.000đ</div>
                                <form class="remove-form" th:action="@{/cart/remove}" method="post">
                                    <input type="hidden" name="cartItemId" th:value="${item.cartItemId}">
                                    <input type="hidden" name="_csrf" th:value="${_csrf != null ? _csrf.token : ''}">
                                    <button type="submit" class="remove-btn mt-2">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                
                <a href="/shop" class="continue-shopping mt-3">
                    <i class="fas fa-arrow-left"></i> Tiếp tục mua sắm
                </a>
            </div>
            
            <!-- Cart Summary -->
            <div class="col-lg-4">
                <div class="cart-summary">
                    <h4 class="mb-4">Tóm tắt đơn hàng</h4>
                    
                    <div class="summary-row">
                        <span>Tạm tính:</span>
                        <span id="subtotal" th:text="${#numbers.formatDecimal(subtotal, 0, 'COMMA', 0, 'POINT') + 'đ'}">5.600.000đ</span>
                    </div>
                    
                    <div class="summary-row">
                        <span>Phí vận chuyển:</span>
                        <span id="shipping" th:text="${shipping == 0 ? 'Miễn phí' : #numbers.formatDecimal(shipping, 0, 'COMMA', 0, 'POINT') + 'đ'}">0đ</span>
                    </div>
                    
                    <div class="summary-row summary-total">
                        <span>Tổng cộng:</span>
                        <span id="total" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT') + 'đ'}">5.600.000đ</span>
                    </div>
                    
                    <a href="/checkout" id="checkout-btn" class="checkout-btn mt-3">
                        Tiến hành thanh toán
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Empty Cart -->
        <div th:if="${itemCount == 0}" class="empty-cart">
            <div class="empty-cart-icon">
                <i class="fas fa-shopping-cart"></i>
            </div>
            <h3 class="empty-cart-message">Giỏ hàng của bạn đang trống</h3>
            <a href="/shop" class="btn btn-dark">Tiếp tục mua sắm</a>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{shared/fragments/footer :: footer}"></footer>

    <th:block th:replace="~{shared/fragments/scripts :: scripts(~{})}"></th:block>
    
    <!-- Hiển thị thông báo -->
    <script th:if="${errorMessage != null}">
        Swal.fire({
            icon: 'error',
            title: 'Lỗi',
            text: /*[[${errorMessage}]]*/ 'Đã xảy ra lỗi',
            confirmButtonText: 'Đóng'
        });
    </script>
    
    <script th:if="${successMessage != null}">
        Swal.fire({
            icon: 'success',
            title: 'Thành công',
            text: /*[[${successMessage}]]*/ 'Thao tác thành công',
            showConfirmButton: false,
            timer: 2000
        });
    </script>
    
    <script>
        function confirmLogout() {
            Swal.fire({
                title: 'Xác nhận đăng xuất',
                text: 'Bạn có chắc chắn muốn đăng xuất không?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Đăng xuất',
                cancelButtonText: 'Hủy',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('logout-form').submit();
                }
            });
        }
    </script>
    
    <!-- Script xử lý tăng giảm số lượng -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Xử lý nút giảm số lượng
            document.querySelectorAll('.quantity-decrease').forEach(btn => {
                btn.addEventListener('click', function() {
                    const input = this.parentElement.querySelector('.quantity-input');
                    const currentValue = parseInt(input.value);
                    
                    if (currentValue > 1) {
                        input.value = currentValue - 1;
                        const form = this.closest('.update-form');
                        form.submit();
                    }
                });
            });
            
            // Xử lý nút tăng số lượng
            document.querySelectorAll('.quantity-increase').forEach(btn => {
                btn.addEventListener('click', function() {
                    const input = this.parentElement.querySelector('.quantity-input');
                    const currentValue = parseInt(input.value);
                    
                    input.value = currentValue + 1;
                    const form = this.closest('.update-form');
                    form.submit();
                });
            });
            
            // Xử lý thay đổi trực tiếp trong input số lượng
            document.querySelectorAll('.quantity-input').forEach(input => {
                input.addEventListener('change', function() {
                    let value = parseInt(this.value);
                    
                    // Đảm bảo giá trị hợp lệ
                    if (isNaN(value) || value < 1) {
                        value = 1;
                        this.value = 1;
                    }
                    
                    const form = this.closest('.update-form');
                    form.submit();
                });
            });
        });
    </script>

</body>
</html>
