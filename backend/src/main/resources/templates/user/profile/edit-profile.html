<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{shared/fragments/head :: head('Chỉnh sửa thông tin', ~{::link})}">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
<!-- Navigation -->
<nav th:replace="~{shared/fragments/navbar :: navbar('profile')}"></nav>

<!-- Breadcrumb -->
<header class="breadcrumb-section">
    <div class="container">
        <nav class="d-flex">
            <a href="/" class="me-2">TRANG CHỦ</a>
            <span class="mx-2">/</span>
            <a href="/profile" class="me-2">TÀI KHOẢN</a>
            <span class="mx-2">/</span>
            <span>CHỈNH SỬA THÔNG TIN</span>
        </nav>
    </div>
</header>

<main class="container py-5">
    <div class="profile-container">
        <!-- Profile Sidebar -->
        <div class="profile-sidebar">
            <div class="profile-menu">
                <div class="profile-menu-header">
                    <div>
                        <div class="profile-name" th:text="${user.name}">Nguyễn Văn A</div>
                        <div class="profile-email" th:text="${user.email}">nguyenvana@example.com</div>
                    </div>
                </div>
                <ul class="profile-menu-items">
                    <li class="profile-menu-item"><a href="/profile" class="profile-menu-link"><i class="fas fa-user profile-menu-icon"></i> Thông tin tài khoản</a></li>
                    <li class="profile-menu-item"><a href="/profile/orders" class="profile-menu-link"><i class="fas fa-shopping-bag profile-menu-icon"></i> Đơn hàng của tôi</a></li>
                    <li class="profile-menu-item"><a href="/profile/wishlist" class="profile-menu-link"><i class="fas fa-heart profile-menu-icon"></i> Danh sách yêu thích</a></li>
                    <li class="profile-menu-item"><a href="/profile/edit" class="profile-menu-link active"><i class="fas fa-cog profile-menu-icon"></i> Chỉnh sửa thông tin</a></li>
                    <li class="profile-menu-item"><a href="#" onclick="confirmLogout()" class="profile-menu-link"><i class="fas fa-sign-out-alt profile-menu-icon"></i> Đăng xuất</a></li>
                </ul>
            </div>
        </div>

        <!-- Profile Content -->
        <div class="profile-content">
            <form class="edit-profile-form" action="/profile/update" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <!-- Account Information Card -->
                <div class="profile-card mb-4">
                    <div class="profile-card-header">
                        <h2 class="profile-card-title"><i class="fas fa-user-circle me-2"></i>Thông tin tài khoản</h2>
                    </div>
                    <div class="profile-card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="username" class="form-label">Tên đăng nhập</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                                        <input type="text" id="username" name="username" class="form-control" th:value="${user.username}" readonly>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="name" class="form-label d-flex align-items-center">
                                        Họ và tên <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                                        <input type="text" id="name" name="name" class="form-control" th:value="${user.name}" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="email" class="form-label d-flex align-items-center">
                                        Email
                                        <span class="ms-1 text-muted" data-bs-toggle="tooltip" data-bs-placement="top" 
                                              title="Định dạng email hợp lệ (ví dụ: example@domain.com)">
                                            <i class="fas fa-question-circle"></i>
                                        </span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                        <input type="email" id="email" name="email" class="form-control" th:value="${user.email}">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="phoneNumber" class="form-label d-flex align-items-center">
                                        Số điện thoại
                                        <span class="ms-1 text-muted" data-bs-toggle="tooltip" data-bs-placement="top" 
                                              title="Số điện thoại hợp lệ, chỉ bao gồm số và ký tự như +, -, ()">
                                            <i class="fas fa-question-circle"></i>
                                        </span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                        <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" th:value="${user.phoneNumber}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Address Information Card -->
                <div class="profile-card mb-4">
                    <div class="profile-card-header">
                        <h2 class="profile-card-title"><i class="fas fa-map-marker-alt me-2"></i>Địa chỉ giao hàng</h2>
                    </div>
                    <div class="profile-card-body">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="street" class="form-label">Địa chỉ</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-home"></i></span>
                                        <input type="text" id="street" name="street" class="form-control" th:value="${user.street}" placeholder="Số nhà, tên đường">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="ward" class="form-label">Phường/Xã</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-map"></i></span>
                                        <input type="text" id="ward" name="ward" class="form-control" th:value="${user.ward}">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="district" class="form-label">Quận/Huyện</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-map-signs"></i></span>
                                        <input type="text" id="district" name="district" class="form-control" th:value="${user.district}">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="city" class="form-label">Tỉnh/Thành phố</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-city"></i></span>
                                        <input type="text" id="city" name="city" class="form-control" th:value="${user.city}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Form Actions -->
                <div class="d-flex justify-content-end mt-4">
                    <a href="/profile" class="btn btn-light me-2">
                        <i class="fas fa-times me-1"></i> Hủy
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{shared/fragments/footer :: footer}"></footer>

<th:block th:replace="~{shared/fragments/scripts :: scripts(~{})}"></th:block>

<!-- Hidden form for logout POST request -->
<form id="logout-form" th:action="@{/logout}" method="post" style="display:none;">
    <input type="hidden" name="_csrf" th:if="${_csrf != null}" th:value="${_csrf.token}"/>
</form>

<script>
    function confirmLogout() {
        Swal.fire({
            title: 'Xác nhận đăng xuất',
            text: 'Bạn có chắc chắn muốn đăng xuất không?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Đăng xuất',
            cancelButtonText: 'Hủy',
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                document.getElementById('logout-form').submit();
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        // Initialize tooltips
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function(tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
        
        const params = new URLSearchParams(window.location.search);
        
        // Check for URL parameters
        if (params.get("logout") === "success") {
            Swal.fire({
                icon: 'success',
                title: 'Đăng xuất thành công!',
                timer: 2000,
                showConfirmButton: false
            }).then(() => {
                window.history.replaceState({}, document.title, window.location.pathname);
                window.location.reload();
            });
        }
        
        if (params.get("updated") === "success") {
            Swal.fire({
                icon: 'success',
                title: 'Cập nhật thông tin thành công!',
                timer: 2000,
                showConfirmButton: false
            }).then(() => {
                window.history.replaceState({}, document.title, window.location.pathname);
            });
        }
    });
</script>
</body>
</html>
